name: Aave 数据采集（副）

# 只抓数据写 MongoDB，不判规则不推送。
# 目的是提高采样密度：GitHub 对单个 workflow 的定时任务调度会大幅延迟
# （主 workflow 配 5 分钟，实测 33 分钟才跑一次），多开一个错峰的 runner
# 能把数据补密。MongoDB 写入是幂等的（timeBucket + upsert），
# 两个 runner 同时写同一个时间桶不会产生重复。
#
# 报警必须留在主 workflow：两边各自维护 cooldown 状态，
# 都发的话同一次下跌会被通知两次，每日推送也会来两条。
on:
  schedule:
    - cron: '3,11,19,27,35,43,51,59 * * * *'   # 8 分钟一次，且与主 workflow 的整点边界错开
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aave-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: aave-env
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --omit=dev

      # 用独立的 cache key，不跟主 workflow 的报警状态混在一起
      - name: 恢复采集状态
        uses: actions/cache/restore@v6
        with:
          path: aave/data
          key: aave-collect-
          restore-keys: aave-collect-

      - name: 准备配置
        run: '[ -f aave/config.json ] || cp aave/config.example.json aave/config.json'

      - name: 采集
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ETH_RPC_URLS: ${{ secrets.ETH_RPC_URLS }}
          # 刻意不注入 TELEGRAM secrets —— 这个 workflow 不该有推送能力
        run: node aave/index.js once --collect-only --quiet

      - name: 保存采集状态
        if: always()
        uses: actions/cache/save@v6
        with:
          path: aave/data
          key: aave-collect-${{ github.run_id }}-${{ github.run_attempt }}
