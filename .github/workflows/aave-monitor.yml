name: Aave 风控监控

# 只在定时和手动触发时运行。
# 绝对不要加 pull_request / pull_request_target —— public 仓库里那两个事件
# 会把 Secrets 暴露给任何人提交的 PR，是经典的 token 泄漏漏洞。
on:
  schedule:
    # 每 5 分钟。GitHub 的定时任务不保证准时，高峰期可能延迟 10-30 分钟。
    # private 仓库要改成 '*/22 * * * *' 才能卡在每月 2000 分钟免费额度内。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: once
        type: choice
        options:
          - once      # 正常检查，只在命中阈值时才推送
          - snapshot  # 无条件推一条当前状态到 TG，用来验证凭据链路
          - check     # 只打印指标和阈值对照，不推送

# 只读代码就够：历史数据写 MongoDB，不需要往仓库推任何东西
permissions:
  contents: read

# 同一时间只跑一个，避免两个实例同时读写报警状态
concurrency:
  group: aave-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖（只装 viem）
        run: npm ci --omit=dev

      # 报警状态：cooldown 计时、变化类规则的基线快照、限流计数。
      # 丢了的话 cooldown 失效（条件持续满足就每轮都报），变化类规则不工作。
      - name: 恢复报警状态
        uses: actions/cache/restore@v4
        with:
          path: aave/data
          key: aave-state-
          restore-keys: aave-state-

      - name: 准备配置
        run: '[ -f aave/config.json ] || cp aave/config.example.json aave/config.json'

      - name: 运行
        env:
          AAVE_TELEGRAM_BOT_TOKEN: ${{ secrets.AAVE_TELEGRAM_BOT_TOKEN }}
          AAVE_TELEGRAM_CHAT_ID: ${{ secrets.AAVE_TELEGRAM_CHAT_ID }}
          # 可选：配了这个 Secret 就用你自己的节点，否则走配置里的公共节点
          ETH_RPC_URLS: ${{ secrets.ETH_RPC_URLS }}
          # 可选：配了就往 MongoDB 落一份（含密码，必须放 Secrets 不能进配置文件）
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          MODE="${{ inputs.mode || 'once' }}"
          echo "模式: $MODE"
          if [ "$MODE" = "once" ]; then
            node aave/index.js once --quiet
          else
            node aave/index.js "$MODE"
          fi

      - name: 保存报警状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aave/data
          key: aave-state-${{ github.run_id }}-${{ github.run_attempt }}
