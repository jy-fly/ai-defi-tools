name: Bybit 价格监控

# 数据源用 Kraken —— Bybit 封美国 IP，runner 在 Azure 美国节点直连会 403。
# 试过在 CI 上起 mihomo 走机场订阅，但为每 5 分钟一次的请求下载 18MB 二进制、
# 传节点凭据、还要扛机场风控，不划算。
# Kraken 的报价靠 config 里的 priceOffset 平移到 Bybit 口径。
# 定时已关闭。取消下面 schedule 的注释即可恢复，
# 其余配置（阈值、群、校准）都原样留着。
on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: once
        type: choice
        options:
          - once
          - snapshot
          - check

permissions:
  contents: read

concurrency:
  group: bybit-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: aave-env
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --omit=dev

      - name: 准备配置
        run: '[ -f bybit/config.json ] || cp bybit/config.example.json bybit/config.json'

      - name: 恢复状态
        uses: actions/cache/restore@v6
        with:
          path: bybit/data
          key: bybit-state-
          restore-keys: bybit-state-

      - name: 运行
        env:
          BYBIT_TELEGRAM_BOT_TOKEN: ${{ secrets.BYBIT_TELEGRAM_BOT_TOKEN }}
          BYBIT_TELEGRAM_CHAT_ID: ${{ secrets.BYBIT_TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AAVE_TELEGRAM_BOT_TOKEN }}
        run: |
          MODE="${{ inputs.mode || 'once' }}"
          echo "模式: $MODE"
          if [ "$MODE" = "once" ]; then
            node bybit/index.js once --quiet
          else
            node bybit/index.js "$MODE"
          fi

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v6
        with:
          path: bybit/data
          key: bybit-state-${{ github.run_id }}-${{ github.run_attempt }}
